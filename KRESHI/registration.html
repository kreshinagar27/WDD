<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <nav>
        <a href="index.html">Home</a> |
        <a href="courses.html">Courses</a> |
        <a href="gallery.html">Gallery</a> |
        <a href="registration.html">Registration</a> |
    </nav>
    <hr>
    <form action="#" method="post">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email address:</label>
         <input type="email" id="email" name="email" placeholder="example@email.com" required>
        <br><br>

         <label for="phone"> Phone:</label>
         <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10 digit number" required>
        <br><br>

        <label for="password "> Password:</label>
         <input type="Password" id="Password" name="Password" minlength="6" maxlength="10" required>
        <br><br>
        <label for="dob"> Date of Birth:</label>
         <input type="date" id="dob" name="dob" required>
        <br><br>

        <label> Gender: </label>
         <input type="radio" id="male" name="gender" value="Male">
         <label for="Male"> Male</label>
         <input type="radio" id="female" name="gender" value="Female">
         <label for="Female"> Female</label>
         <input type="radio" id="Other" name="gender" value="Other">
         <label for="Other"> Other</label>
        <br><br>
    <label for="course"> Course: </label>
    <select id="course" name="course" required>
        <option value="">--Select Course--</option>
        <option>BCA</option>
        <option>B.TECH</option>
        <option>B.Sc</option>
        <option>MCA</option>
        <option>M.Tech</option>
    </select>     
    <br><br>
     <label> Skills: </label>
         <input type="checkbox" id="html" name="skills" value="HTML">
         <label for="HTML"> HTML</label>
         <input type="checkbox" id="JAVA" name="skills" value="JAVA">
         <label for="JAVA"> JAVA</label>
        <br><br>
        <label for="address">Address:</label>
        <textarea name="address" id="address" rows="4" cols="40" placeholder="Enter your address"></textarea>
        <br><br>

        <label for="photo">Upload photo:</label>
        <input type="file" name="photo" id="photo" accept="image/*">
        <br><br>

        <label for="favcolor">Favourite Colour:</label>
        <input type="color" name="favcolor" id="favcolor">
        <br><br>

        <label for="admission">Admission Month:</label>
        <input type="month" name="admission" id="admission">
        <br><br>

        <label for="studytime">preferred study time</label>
        <input type="time" name="studytime" id="studytime">
        <br><br>

        <input type="checkbox"  id="agree" required>
        <label for="agree">I agree to the terms and conditions</label>
        <br><br>

        <input type="submit" value="register">
        <input type="reset" value="Clear form">

        
    </form>
</body>
</html>
